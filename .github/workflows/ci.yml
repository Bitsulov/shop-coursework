name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create .env
        run: |
          cp .github/ci.env .env
          cp .github/ci.env backend/.env

      - name: Start infrastructure
        working-directory: tools/docker
        run: docker compose --env-file ../../.env up -d --wait postgres rabbitmq rustfs mailpit

      - name: Build and test backend
        working-directory: backend
        env:
          DB_HOST: localhost
          RABBIT_MQ_HOST: localhost
          MAIL_HOST: localhost
          S3_ENDPOINT: http://localhost:9000
        run: ./gradlew build

      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run lint:style
          npm run format:check
          npm run test:coverage
          npm run build

      - name: Start application
        working-directory: tools/docker
        run: docker compose --env-file ../../.env up -d --build --wait backend frontend nginx

      - name: Show container logs
        if: failure()
        working-directory: tools/docker
        run: docker compose --env-file ../../.env logs

  prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create .env
        run: cp .github/ci.env .env

      - name: Start production stack
        working-directory: tools/docker
        run: docker compose --env-file ../../.env -f compose.yaml -f compose.prod.yaml up -d --build --wait

      - name: Show container logs
        if: failure()
        working-directory: tools/docker
        run: docker compose --env-file ../../.env -f compose.yaml -f compose.prod.yaml logs
