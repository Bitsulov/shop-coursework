services:
  postgres:
    container_name: shop_postgres_dev
    ports:
      - "${DB_PORT:-5432}:5432"

  rabbitmq:
    container_name: shop_rabbitmq_dev
    ports:
      - "5672:5672"
      - "15672:15672"

  rustfs:
    container_name: shop_rustfs_dev
    ports:
      - "9000:9000"
      - "9001:9001"

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: shop_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: shop_mailpit_dev
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    container_name: shop_backend_dev
    ports:
      - "8080:8080"
    depends_on:
      mailpit:
        condition: service_started

  nginx:
    container_name: shop_nginx_dev

volumes:
  pgadmin-data:
