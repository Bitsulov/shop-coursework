spring:
  application:
    name: shop

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  config:
    import:
      - optional:file:.env[.properties]
      - classpath:application-db.yml
      - classpath:application-logger.yml
      - classpath:application-s3.yml
      - classpath:application-swagger.yml
      - classpath:application-mail.yml
      - classpath:application-mb.yml

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET_KEY}
    access-token-validity: ${JWT_ACCESS_TIME}
    refresh-token-validity: ${JWT_REFRESH_TIME}
  code-expiration-time: 15m
  allow-new-code-time: 2m
  code-max-attempts: 5

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
