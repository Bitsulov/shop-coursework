<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Подтверждение регистрации</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f5; padding: 20px;">
    <table style="font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f5;" width="100%">
        <tr>
            <td align="center">
                <table style="background-color: #ffffff; border: 1px solid #e4e4e7; padding: 20px;">
                    <tr>
                        <td>
                            <h1 style="text-align: center; font-size: 28px; margin-bottom: 30px; color: #18181b">Подтверждение регистрации</h1>
                            <p style="font-size: 16px; color: #18181b">Спасибо за регистрацию в нашем магазине Shop.</p>
                            <p style="font-size: 16px; color: #18181b">Ваш код подтверждения:</p>
                            <h2 style="font-size: 28px; font-weight: bold; color: #2346e8" th:text="${verificationCode}">123456</h2>
                            <p style="font-size: 16px; color: #71717a">Если вы не запрашивали это письмо, просто проигнорируйте его.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
